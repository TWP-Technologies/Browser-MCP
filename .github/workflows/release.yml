name: local-mcp-bun-release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (vX.Y.Z or X.Y.Z)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version_tagged: ${{ steps.version.outputs.version_tagged }}
      version_clean: ${{ steps.version.outputs.version_clean }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install
        working-directory: local-mcp-bun

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            raw_version="${{ github.event.inputs.version }}"
          else
            raw_version="${GITHUB_REF_NAME}"
          fi
          clean_version="${raw_version#v}"
          echo "version_clean=${clean_version}" >> "${GITHUB_OUTPUT}"
          echo "version_tagged=v${clean_version}" >> "${GITHUB_OUTPUT}"

      - name: Validate release version sync
        run: bun run release:check-version -- --version=${{ steps.version.outputs.version_tagged }}
        working-directory: local-mcp-bun

  package-server:
    needs: resolve-version
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install
        working-directory: local-mcp-bun

      - name: Package server binary
        run: bun run package:release -- --mode=server --version=${{ needs.resolve-version.outputs.version_tagged }} --clean
        working-directory: local-mcp-bun

      - name: Smoke test packaged Linux binary (daemon mode)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          binary_path="dist/release/v${{ needs.resolve-version.outputs.version_clean }}/chrome-browser-mcp-v${{ needs.resolve-version.outputs.version_clean }}-linux-x64"
          MCP_DAEMON_MODE=daemon "${binary_path}" > /tmp/chrome-browser-mcp-daemon.log 2>&1 &
          daemon_pid=$!
          cleanup() {
            kill "${daemon_pid}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for _ in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:37778/health >/tmp/chrome-browser-mcp-health.json; then
              break
            fi
            sleep 0.25
          done

          curl --silent --fail http://127.0.0.1:37778/health | tee /tmp/chrome-browser-mcp-health-final.json >/dev/null
        working-directory: local-mcp-bun

      - name: Upload server artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-server-${{ matrix.os }}
          path: local-mcp-bun/dist/release/v${{ needs.resolve-version.outputs.version_clean }}/*
          if-no-files-found: error

  package-extension:
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install
        working-directory: local-mcp-bun

      - name: Package extension archive
        run: bun run package:release -- --mode=extension --version=${{ needs.resolve-version.outputs.version_tagged }} --clean
        working-directory: local-mcp-bun

      - name: Verify extension archive integrity
        run: bun run verify:release-extension -- --zip dist/release/v${{ needs.resolve-version.outputs.version_clean }}/chrome-browser-mcp-chrome-extension-v${{ needs.resolve-version.outputs.version_clean }}.zip
        working-directory: local-mcp-bun

      - name: Upload extension artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-extension
          path: local-mcp-bun/dist/release/v${{ needs.resolve-version.outputs.version_clean }}/*
          if-no-files-found: error

  release:
    needs:
      - resolve-version
      - package-server
      - package-extension
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download server linux artifact
        uses: actions/download-artifact@v8
        with:
          name: release-server-ubuntu-latest
          path: release-assets/linux

      - name: Download server macOS artifact
        uses: actions/download-artifact@v8
        with:
          name: release-server-macos-latest
          path: release-assets/macos

      - name: Download server Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: release-server-windows-latest
          path: release-assets/windows

      - name: Download extension artifact
        uses: actions/download-artifact@v8
        with:
          name: release-extension
          path: release-assets/extension

      - name: Build consolidated checksums
        shell: bash
        run: |
          set -euo pipefail
          find release-assets -mindepth 2 -type f -name 'SHA256SUMS.txt' -delete
          find release-assets -type f \
            ! -name 'SHA256SUMS.txt' \
            ! -name '*.sha256' \
            -print0 \
            | sort -z \
            | xargs -0 sha256sum > release-assets/SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_TAGGED: ${{ needs.resolve-version.outputs.version_tagged }}
        shell: bash
        run: |
          set -euo pipefail

          files=(
            release-assets/linux/*
            release-assets/macos/*
            release-assets/windows/*
            release-assets/extension/*
            release-assets/SHA256SUMS.txt
          )

          if gh release view "${VERSION_TAGGED}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${VERSION_TAGGED}" --repo "${GITHUB_REPOSITORY}" "${files[@]}" --clobber
          else
            gh release create "${VERSION_TAGGED}" --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" --title "${VERSION_TAGGED}" "${files[@]}"
          fi
