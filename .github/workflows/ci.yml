name: local-mcp-bun-ci

on:
  push:
    branches:
      - trunk
  pull_request:
    branches:
      - trunk

jobs:
  hard-gate:
    name: hard-gate-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install
        working-directory: local-mcp-bun

      - name: Install Playwright Browser (Linux)
        if: runner.os == 'Linux'
        run: bunx playwright install --with-deps chromium
        working-directory: local-mcp-bun

      - name: Install Playwright Browser (macOS/Windows)
        if: runner.os != 'Linux'
        run: bunx playwright install chromium
        working-directory: local-mcp-bun

      - name: Validate living spec linkage
        run: bun run lint:spec
        working-directory: local-mcp-bun

      - name: Validate legal and branding compliance
        run: bun run lint:compliance
        working-directory: local-mcp-bun

      - name: Run hard quality gate
        id: hard_gate
        run: bun run test:hard-gate:ci
        working-directory: local-mcp-bun

      - name: Write CI evidence
        if: always()
        env:
          HARD_GATE_OUTCOME: ${{ steps.hard_gate.outcome }}
        run: bun run ci:evidence
        working-directory: local-mcp-bun

      - name: Upload hard-gate evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hard-gate-evidence-${{ matrix.os }}
          path: local-mcp-bun/ci-evidence/*.json
          if-no-files-found: error
